<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Choose your profession — Nexus adapts to you. Pick the role that fits you best.">
  <meta name="theme-color" content="#05070d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MAJID">
  <meta name="application-name" content="MAJID">
  <meta name="format-detection" content="telephone=no">
  <title>Choose Your Role — MAJID</title>

  <!-- ⚡ AUTO-REDIRECT IF ALREADY LOGGED IN -->
  <script>
    (function () {
      try {
        var token = localStorage.getItem('nexus_token') || localStorage.getItem('token');
        var rawUser = localStorage.getItem('nexus_user') || localStorage.getItem('user');
        if (token && rawUser) {
          var user = JSON.parse(rawUser);
          if (user && user.role) {
            var r = String(user.role).toLowerCase();
            if (r === 'super_admin' || r === 'admin') {
              window.location.replace('admin-dashboard.html');
            } else if (r === 'student') {
              window.location.replace('student-dashboard.html');
            } else {
              window.location.replace('dashboard.html');
            }
          }
        }
      } catch (e) {}
    })();
  </script>

  <!-- Preload critical resources -->
  <link rel="preload" as="style" href="style.css">
  <link rel="preload" as="script" href="index.js">
  <link rel="preload" as="script" href="profession.js">
  
  <!-- Fonts with preconnect for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.svg">
  <link rel="icon" type="image/svg+xml" sizes="192x192" href="icon-192.svg">
  <link rel="icon" type="image/svg+xml" sizes="512x512" href="icon-512.svg">
  
  <!-- DNS Prefetch for external resources -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
</head>

<body class="page-profession">

  <!-- Background Layers -->
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="particles" id="particles"></div>

  <!-- ================================
       MAIN CONTENT
       ================================ -->
  <main class="hero profession-hero">

    <!-- Back Button (top left) -->
    <a href="index.html" class="back-btn anim anim-badge" aria-label="Go back">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 17l-5-5m0 0l5-5m-5 5h12"/>
      </svg>
      <span>Back</span>
    </a>

    <!-- Step Indicator -->
    <div class="steps anim anim-badge">
      <span class="step-dot active">1</span>
      <span class="step-line"></span>
      <span class="step-dot">2</span>
      <span class="step-line"></span>
      <span class="step-dot">3</span>
      <span class="step-line"></span>
      <span class="step-dot">4</span>
    </div>

    <!-- Heading -->
    <h1 class="anim anim-title profession-title">
      Who are <span class="grad-text">you?</span>
    </h1>

    <!-- Subheading -->
    <p class="anim anim-sub profession-sub">
      Pick the role that fits you best. We'll build a custom workspace around it —
      you can always switch later.
    </p>

    <!-- ================================
         PROFESSION GRID
         ================================ -->
    <div class="prof-grid anim anim-stats" id="profGrid">

      <!-- Student -->
      <button type="button" class="prof-card" data-role="student">
        <div class="prof-icon">🎓</div>
        <h3 class="prof-name">Student</h3>
        <p class="prof-desc">School, college, exams & self-study</p>
        <span class="prof-check">✓</span>
      </button>

      <!-- Employee -->
      <button type="button" class="prof-card" data-role="employee">
        <div class="prof-icon">💼</div>
        <h3 class="prof-name">Employee</h3>
        <p class="prof-desc">Office work, projects & productivity</p>
        <span class="prof-check">✓</span>
      </button>

      <!-- Trader -->
      <button type="button" class="prof-card" data-role="trader">
        <div class="prof-icon">📈</div>
        <h3 class="prof-name">Trader</h3>
        <p class="prof-desc">Markets, charts & portfolio tracking</p>
        <span class="prof-check">✓</span>
      </button>

      <!-- Creator -->
      <button type="button" class="prof-card" data-role="creator">
        <div class="prof-icon">🎨</div>
        <h3 class="prof-name">Creator</h3>
        <p class="prof-desc">Content, design, video & writing</p>
        <span class="prof-check">✓</span>
      </button>

      <!-- Developer -->
      <button type="button" class="prof-card" data-role="developer">
        <div class="prof-icon">💻</div>
        <h3 class="prof-name">Developer</h3>
        <p class="prof-desc">Code, projects, bugs & documentation</p>
        <span class="prof-check">✓</span>
      </button>

      <!-- Freelancer -->
      <button type="button" class="prof-card" data-role="freelancer">
        <div class="prof-icon">🧑‍💻</div>
        <h3 class="prof-name">Freelancer</h3>
        <p class="prof-desc">Clients, gigs, invoices & time tracking</p>
        <span class="prof-check">✓</span>
      </button>

      <!-- Teacher -->
      <button type="button" class="prof-card" data-role="teacher">
        <div class="prof-icon">📚</div>
        <h3 class="prof-name">Teacher</h3>
        <p class="prof-desc">Lessons, students, assignments</p>
        <span class="prof-check">✓</span>
      </button>

      <!-- Doctor -->
      <button type="button" class="prof-card" data-role="doctor">
        <div class="prof-icon">🩺</div>
        <h3 class="prof-name">Doctor</h3>
        <p class="prof-desc">Patients, notes & medical records</p>
        <span class="prof-check">✓</span>
      </button>

      <!-- Other -->
      <button type="button" class="prof-card" data-role="other">
        <div class="prof-icon">✨</div>
        <h3 class="prof-name">Something Else</h3>
        <p class="prof-desc">Tell us your role, we'll adapt</p>
        <span class="prof-check">✓</span>
      </button>

    </div>

    <!-- Custom role input (only for "other") -->
    <div class="custom-role-wrap" id="customRoleWrap" hidden>
      <input type="text"
             id="customRoleInput"
             class="custom-role-input"
             placeholder="e.g. Photographer, Lawyer, Chef…"
             autocomplete="off"
             maxlength="40">
    </div>

    <!-- Continue Button -->
    <div class="anim anim-btn profession-actions">
      <button type="button"
              id="continueBtn"
              class="cta pulse-ring"
              disabled>
        <span class="cta-text">Continue</span>
        <svg class="cta-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
        </svg>
      </button>
    </div>

    <!-- Footnote -->
    <p class="anim anim-footnote hero-footnote">
      You can switch your role anytime from settings
    </p>

  </main>

  <!-- Script -->
  <script src="index.js" defer></script>
  <script src="profession.js" defer></script>
</body>
</html>
