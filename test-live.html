<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Test — Nexus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="vault.css">

  <!-- Role guard -->
  <script src="role-guard.js" data-page="student"></script>

  <style>
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes shimmer { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    @keyframes pulse-glow { 0%,100%{box-shadow:0 0 12px rgba(34,211,238,0.2)} 50%{box-shadow:0 0 24px rgba(34,211,238,0.5)} }
    @keyframes slide-in { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
    @keyframes correctFlash { 0%{background:rgba(16,185,129,0.15)} 100%{background:rgba(16,185,129,0.05)} }
    @keyframes incorrectFlash { 0%{background:rgba(239,68,68,0.15)} 100%{background:rgba(239,68,68,0.05)} }

    .grad-text { background:linear-gradient(90deg,#22d3ee,#3b82f6,#8b5cf6,#22d3ee); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 6s ease infinite; }
    .nx-card { background:rgba(255,255,255,0.03); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.08); border-radius:1.25rem; transition:all 0.3s cubic-bezier(0.16,1,0.3,1); }

    .option-btn { transition:all 0.25s cubic-bezier(0.16,1,0.3,1); }
    .option-btn:hover:not(.answered) { border-color:rgba(34,211,238,0.5); background:rgba(34,211,238,0.05); transform:translateX(4px); }
    .option-btn.selected { border-color:rgba(34,211,238,0.6); background:rgba(34,211,238,0.1); }
    .option-btn.correct { border-color:#10b981 !important; background:rgba(16,185,129,0.1) !important; animation:correctFlash 0.5s ease; }
    .option-btn.incorrect { border-color:#ef4444 !important; background:rgba(239,68,68,0.1) !important; animation:incorrectFlash 0.5s ease; }
    .option-btn.answered { pointer-events:none; }

    .q-dot { width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; cursor:pointer; transition:all 0.2s ease; border:1px solid rgba(255,255,255,0.1); }
    .q-dot.current { border-color:#22d3ee; background:rgba(34,211,238,0.2); color:#67e8f9; box-shadow:0 0 12px rgba(34,211,238,0.3); }
    .q-dot.answered-correct { border-color:#10b981; background:rgba(16,185,129,0.15); color:#34d399; }
    .q-dot.answered-incorrect { border-color:#ef4444; background:rgba(239,68,68,0.15); color:#f87171; }
    .q-dot.skipped { border-color:rgba(255,255,255,0.08); background:rgba(255,255,255,0.02); color:#64748b; }

    .timer-pulse { animation:pulse-glow 2s ease-in-out infinite; }
    .question-enter { animation:slide-in 0.3s cubic-bezier(0.16,1,0.3,1) forwards; }
  </style>
</head>

<body class="min-h-screen relative overflow-x-hidden bg-ink-950 text-slate-200 font-sans antialiased">

  <!-- Background -->
  <div class="fixed inset-0 pointer-events-none z-0 [background-image:linear-gradient(rgba(34,211,238,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(34,211,238,0.03)_1px,transparent_1px)] [background-size:60px_60px] [mask-image:radial-gradient(ellipse_at_top,black_20%,transparent_80%)]"></div>
  <div class="fixed rounded-full pointer-events-none z-0 blur-[120px] opacity-30 w-[350px] h-[350px] top-[-60px] left-[5%] bg-[radial-gradient(circle,#06b6d4,transparent_70%)]"></div>
  <div class="fixed rounded-full pointer-events-none z-0 blur-[120px] opacity-30 w-[350px] h-[350px] bottom-[-60px] right-[5%] bg-[radial-gradient(circle,#6366f1,transparent_70%)]"></div>

  <!-- Loading State -->
  <div id="loadingState" class="relative z-10 min-h-screen flex items-center justify-center">
    <div class="text-center">
      <div class="w-10 h-10 border-3 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-sm text-slate-400 font-semibold">Starting your test session…</p>
    </div>
  </div>

  <!-- Test UI (hidden until loaded) -->
  <div id="testUI" class="relative z-10 min-h-screen flex flex-col hidden">

    <!-- TOPBAR -->
    <header class="sticky top-0 z-30 backdrop-blur-xl bg-ink-950/80 border-b border-white/[0.06]">
      <div class="px-4 sm:px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white text-xs font-bold shadow-[0_0_15px_rgba(34,211,238,0.3)]">⚡</div>
            <div>
              <p class="text-xs font-black text-white leading-tight" id="testTitle">Chapter Practice</p>
              <p class="text-[10px] text-slate-400" id="testSubtitle">Science • Chapter 1</p>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <!-- Timer -->
          <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white/[0.04] border border-white/10 timer-pulse">
            <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="text-sm font-bold text-white tabular-nums" id="timerDisplay">00:00</span>
          </div>

          <!-- Progress -->
          <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white/[0.04] border border-white/10">
            <span class="text-xs font-bold text-cyan-400" id="progressLabel">0/0</span>
          </div>

          <!-- Finish Button -->
          <button onclick="handleFinishTest()" id="finishBtn" class="px-4 py-2 rounded-xl bg-red-500/15 hover:bg-red-500 text-red-300 hover:text-white font-bold text-xs border border-red-500/30 hover:border-transparent transition-all">
            Finish Test
          </button>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="w-full h-1 bg-white/[0.04]">
        <div id="progressBar" class="h-1 bg-gradient-to-r from-cyan-400 to-blue-500 transition-all duration-500" style="width: 0%"></div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 px-4 sm:px-6 py-6 max-w-5xl w-full mx-auto flex flex-col lg:flex-row gap-6">

      <!-- Question Panel (LEFT) -->
      <div class="flex-1 min-w-0">
        <div id="questionCard" class="nx-card p-6 sm:p-8 question-enter">

          <!-- Question Header -->
          <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-2.5">
              <span class="w-9 h-9 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 font-black text-sm flex items-center justify-center" id="qNumber">01</span>
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-white/[0.06] text-slate-400 border border-white/10" id="qDifficulty">Medium</span>
                <span id="qTagBadge" class="hidden text-[10px] font-bold px-2 py-0.5 rounded-full border"></span>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-[10px] text-slate-500" id="qSubtopic"></span>
              <span class="text-[10px] font-bold text-cyan-400" id="qMarks">1 mark</span>
            </div>
          </div>

          <!-- Question Text -->
          <div class="mb-7">
            <p class="text-base sm:text-lg font-bold text-white leading-relaxed" id="qText"></p>
            <p class="text-sm text-slate-400 mt-2 leading-relaxed" id="qHindiText"></p>
          </div>

          <!-- Options -->
          <div class="space-y-3" id="optionsContainer">
            <!-- Options rendered by JS -->
          </div>

          <!-- Feedback Area -->
          <div id="feedbackArea" class="mt-6 hidden">
            <div id="feedbackCard" class="p-5 rounded-2xl border transition-all">
              <div class="flex items-center gap-2 mb-2">
                <span id="feedbackIcon" class="text-xl"></span>
                <span id="feedbackTitle" class="font-bold text-sm"></span>
              </div>
              <p id="feedbackExplanation" class="text-xs text-slate-300 leading-relaxed"></p>
            </div>
          </div>

          <!-- Official Paper Attribution (if applicable) -->
          <div id="qSourceAttribution" class="hidden mt-5 p-3 rounded-xl bg-white/[0.02] border border-white/[0.05] text-[11px] text-slate-400 flex items-center gap-2">
            <span class="text-cyan-400">🏛️</span>
            <span id="qSourceText"></span>
          </div>

          <!-- Navigation Buttons -->
          <div class="flex items-center justify-between mt-8 pt-5 border-t border-white/[0.06]">
            <button onclick="navigateQuestion(-1)" id="prevBtn" class="px-4 py-2.5 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] text-slate-300 hover:text-white font-bold text-xs border border-white/10 hover:border-white/20 transition-all flex items-center gap-1.5 disabled:opacity-30 disabled:cursor-not-allowed" disabled>
              <span>←</span> <span>Previous</span>
            </button>

            <button onclick="skipQuestion()" id="skipBtn" class="px-4 py-2.5 rounded-xl bg-white/[0.04] hover:bg-amber-500/10 text-slate-400 hover:text-amber-300 font-bold text-xs border border-white/10 hover:border-amber-500/30 transition-all">
              Skip →
            </button>

            <button onclick="navigateQuestion(1)" id="nextBtn" class="px-5 py-2.5 rounded-xl bg-cyan-500/15 hover:bg-cyan-500 text-cyan-300 hover:text-ink-950 font-bold text-xs border border-cyan-500/30 hover:border-transparent transition-all flex items-center gap-1.5">
              <span>Next</span> <span>→</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Question Navigator (RIGHT) -->
      <div class="w-full lg:w-64 shrink-0">
        <div class="nx-card p-5 lg:sticky lg:top-24">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Question Navigator</h3>
          <div id="questionNav" class="grid grid-cols-7 sm:grid-cols-10 lg:grid-cols-5 gap-1.5 mb-5">
            <!-- Dots rendered by JS -->
          </div>

          <!-- Legend -->
          <div class="space-y-2 text-[10px] text-slate-500 border-t border-white/[0.06] pt-4">
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-cyan-500/20 border border-cyan-500/40"></span> Current</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-emerald-500/15 border border-emerald-500/40"></span> Correct</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-red-500/15 border border-red-500/40"></span> Incorrect</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-white/[0.02] border border-white/10"></span> Not Answered</div>
          </div>

          <!-- Stats -->
          <div class="mt-5 pt-4 border-t border-white/[0.06] space-y-2.5">
            <div class="flex items-center justify-between text-xs">
              <span class="text-slate-400">Correct</span>
              <span class="font-bold text-emerald-400" id="statCorrect">0</span>
            </div>
            <div class="flex items-center justify-between text-xs">
              <span class="text-slate-400">Incorrect</span>
              <span class="font-bold text-red-400" id="statIncorrect">0</span>
            </div>
            <div class="flex items-center justify-between text-xs">
              <span class="text-slate-400">Skipped</span>
              <span class="font-bold text-slate-400" id="statSkipped">0</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Finish Confirmation Modal -->
  <div id="finishModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="max-w-sm w-full p-7 rounded-3xl bg-ink-900/95 border border-white/10 shadow-2xl text-center">
      <div class="w-14 h-14 rounded-2xl bg-red-500/15 text-red-400 border border-red-500/25 flex items-center justify-center text-2xl mx-auto mb-4">🏁</div>
      <h3 class="text-lg font-black text-white mb-2">Finish Test?</h3>
      <p class="text-xs text-slate-400 mb-1" id="finishModalStats">You answered 0 of 0 questions.</p>
      <p class="text-xs text-amber-300 mb-6" id="finishModalWarning"></p>
      <div class="flex gap-3">
        <button onclick="closeFinishModal()" class="flex-1 px-4 py-2.5 rounded-xl bg-white/[0.05] border border-white/10 text-slate-300 hover:text-white font-bold text-xs transition">
          Continue Test
        </button>
        <button onclick="confirmFinishTest()" class="flex-1 px-4 py-2.5 rounded-xl bg-red-500 hover:bg-red-400 text-white font-bold text-xs transition">
          Submit & Finish
        </button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="test-live.js"></script>
</body>
</html>
