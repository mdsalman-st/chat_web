<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Test — Nexus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="vault.css">

  <script src="role-guard.js" data-page="student"></script>

  <style>
    :root {
      --bg-color: #05070d;
      --bg-gradient: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.1), transparent 40%), radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.1), transparent 40%);
      --grid-color: rgba(255, 255, 255, 0.02);
      
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --text-link: #22d3ee;
      
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-border-top: rgba(255, 255, 255, 0.15);
      
      --inner-glass-bg: rgba(255, 255, 255, 0.02);
      --inner-glass-border: rgba(255, 255, 255, 0.05);
      --inner-glass-hover: rgba(255, 255, 255, 0.06);
    }

    body {
      background-color: var(--bg-color);
      background-image: var(--bg-gradient), linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Premium Glass Card */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      border-radius: 16px;
    }

    .glass-panel { background: rgba(10, 12, 18, 0.95); border: 1px solid var(--glass-border); }

    /* Option Buttons */
    .option-btn {
      background: var(--inner-glass-bg);
      border: 1px solid var(--inner-glass-border);
      border-radius: 12px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    
    .option-btn:hover:not(.answered) {
      background: var(--inner-glass-hover);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .option-btn.correct {
      border-color: #10b981 !important;
      background: rgba(16, 185, 129, 0.08) !important;
    }
    .option-btn.correct .opt-key {
      background: #10b981;
      color: #000;
      border-color: #10b981;
    }

    .option-btn.incorrect {
      border-color: #ef4444 !important;
      background: rgba(239, 68, 68, 0.08) !important;
    }
    .option-btn.incorrect .opt-key {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
    }

    /* Question Navigation Dots */
    .q-dot {
      width: 100%; aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; border: 1px solid var(--inner-glass-border);
      color: var(--text-muted); background: var(--inner-glass-bg);
      transition: all 0.15s ease; cursor: pointer;
    }
    .q-dot:hover { border-color: var(--text-muted); }
    .q-dot.current { border-color: var(--text-link); background: rgba(34, 211, 238, 0.1); color: var(--text-link); box-shadow: 0 0 10px rgba(34,211,238,0.2); }
    .q-dot.answered-correct { border-color: #10b981; background: rgba(16, 185, 129, 0.1); color: #10b981; }
    .q-dot.answered-incorrect { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    .q-dot.skipped { border-color: var(--inner-glass-border); background: transparent; color: var(--text-muted); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="relative antialiased text-sm">

  <!-- Loading State -->
  <div id="loadingState" class="fixed inset-0 z-50 flex items-center justify-center bg-[#05070d]">
    <div class="text-center">
      <div class="w-10 h-10 border-4 border-cyan-500/30 border-t-cyan-400 rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-sm font-semibold text-slate-400">Loading your test...</p>
    </div>
  </div>

  <!-- Test UI -->
  <div id="testUI" class="hidden flex-col min-h-screen relative">

    <!-- HEADER (Sticky Top) -->
    <header class="glass-panel sticky top-0 z-40 border-b px-4 sm:px-6 h-16 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-cyan-600 flex items-center justify-center text-white text-sm font-bold shadow-sm shadow-cyan-500/50">⚡</div>
        <div>
          <h1 class="text-sm font-bold tracking-wide text-white truncate max-w-[150px] sm:max-w-xs" id="testTitle">Chapter Test</h1>
          <p class="text-[11px] text-slate-400 font-medium truncate max-w-[150px] sm:max-w-xs" id="testSubtitle">Subject • Medium</p>
        </div>
      </div>

      <div class="flex items-center gap-3 sm:gap-5">
        <!-- Timer -->
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/5 border border-white/10">
          <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="text-xs font-semibold text-white font-mono tracking-wider" id="timerDisplay">00:00</span>
        </div>

        <!-- Progress -->
        <div class="hidden sm:flex items-center gap-2">
          <span class="text-xs font-medium text-slate-400">Progress:</span>
          <span class="text-xs font-bold text-cyan-400" id="progressLabel">0 / 0</span>
        </div>

        <button onclick="handleFinishTest()" id="finishBtn" class="px-4 py-1.5 rounded-lg bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white font-semibold text-xs border border-red-500/20 transition-all">
          Finish Test
        </button>
      </div>

      <!-- Top Progress Line -->
      <div class="absolute bottom-0 left-0 w-full h-[2px] bg-white/5">
        <div id="progressBar" class="h-full bg-cyan-500 w-0 rounded-r-full shadow-[0_0_8px_#22d3ee] transition-all duration-300"></div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto w-full flex flex-col lg:flex-row gap-6 p-4 sm:p-6 flex-1">

      <!-- LEFT: Question & Options -->
      <div class="flex-1 min-w-0">
        <div class="glass-card p-5 sm:p-8">
          
          <!-- Meta Header -->
          <div class="flex flex-wrap items-center justify-between gap-3 mb-6 pb-4 border-b border-white/5">
            <div class="flex items-center gap-3">
              <span class="w-8 h-8 rounded-md bg-white/5 border border-white/10 flex items-center justify-center text-xs font-bold text-white" id="qNumber">Q.1</span>
              <span class="text-[10px] font-bold tracking-wider px-2 py-1 rounded bg-white/5 text-slate-300 border border-white/10" id="qDifficulty">MEDIUM</span>
              <span id="qTagBadge" class="hidden text-[10px] font-bold tracking-wider px-2 py-1 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20"></span>
            </div>
            <span class="text-[11px] font-semibold text-cyan-400" id="qMarks">+1 Mark</span>
          </div>

          <!-- Question Text -->
          <div class="mb-8">
            <h2 class="text-lg sm:text-xl font-semibold leading-relaxed text-white mb-3" id="qText">
              Loading question...
            </h2>
            <p class="text-sm font-normal leading-relaxed text-slate-400" id="qHindiText"></p>
          </div>

          <!-- Options Container -->
          <div class="space-y-3" id="optionsContainer"></div>

          <!-- Feedback Area -->
          <div id="feedbackArea" class="mt-6 hidden">
            <div id="feedbackCard" class="p-4 rounded-xl border transition-all">
              <div class="flex items-center gap-2 mb-1.5">
                <span id="feedbackIcon" class="text-lg"></span>
                <span id="feedbackTitle" class="text-sm font-bold"></span>
              </div>
              <p id="feedbackExplanation" class="text-xs text-slate-300 leading-relaxed"></p>
            </div>
          </div>

          <!-- Official Paper Attribution -->
          <div id="qSourceAttribution" class="hidden mt-4 p-3 rounded-lg bg-white/5 border border-white/10 text-[11px] flex items-center gap-2 text-slate-400">
            <span class="text-cyan-400">🏛️</span>
            <span id="qSourceText"></span>
          </div>

          <!-- Navigation Buttons -->
          <div class="flex items-center justify-between mt-8 pt-6 border-t border-white/5">
            <button onclick="navigateQuestion(-1)" id="prevBtn" class="px-5 py-2.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 font-semibold text-xs border border-white/5 transition-all disabled:opacity-30 disabled:cursor-not-allowed">
              Previous
            </button>
            
            <div class="flex gap-3">
              <button onclick="skipQuestion()" id="skipBtn" class="px-5 py-2.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 font-semibold text-xs border border-white/5 transition-all">
                Skip
              </button>
              <button onclick="navigateQuestion(1)" id="nextBtn" class="px-6 py-2.5 rounded-lg bg-cyan-500 text-black font-bold text-xs hover:bg-cyan-400 transition-all shadow-[0_0_15px_rgba(34,211,238,0.3)]">
                Save & Next
              </button>
            </div>
          </div>

        </div>
      </div>

      <!-- RIGHT: Navigator Panel -->
      <div class="w-full lg:w-72 shrink-0">
        <div class="glass-card p-5 sticky top-24">
          
          <h3 class="text-xs font-bold text-white mb-4 uppercase tracking-wider">Question Palette</h3>
          
          <!-- Grid -->
          <div id="questionNav" class="grid grid-cols-5 gap-2 mb-6"></div>

          <!-- Legend -->
          <div class="space-y-2.5 text-xs text-slate-400 mb-6 border-b border-white/5 pb-5">
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-cyan-500/20 border border-cyan-500/50"></span> Current</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-emerald-500/10 border border-emerald-500/50"></span> Correct</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-red-500/10 border border-red-500/50"></span> Incorrect</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded border border-white/10"></span> Not Answered</div>
          </div>

          <!-- Stats Summary -->
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-white/5 rounded-lg p-3 border border-white/5">
              <p class="text-[10px] text-slate-400 uppercase font-semibold mb-1">Correct</p>
              <p class="text-lg font-bold text-emerald-400" id="statCorrect">0</p>
            </div>
            <div class="bg-white/5 rounded-lg p-3 border border-white/5">
              <p class="text-[10px] text-slate-400 uppercase font-semibold mb-1">Incorrect</p>
              <p class="text-lg font-bold text-red-400" id="statIncorrect">0</p>
            </div>
            <div class="bg-white/5 rounded-lg p-3 border border-white/5 col-span-2">
              <p class="text-[10px] text-slate-400 uppercase font-semibold mb-1">Skipped / Remaining</p>
              <p class="text-lg font-bold text-slate-300" id="statSkipped">0</p>
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>

  <!-- Finish Confirmation Modal -->
  <div id="finishModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card max-w-sm w-full p-6 sm:p-8 text-center" style="animation: fadeIn 0.3s ease;">
      <div class="w-16 h-16 rounded-full bg-red-500/10 text-red-500 flex items-center justify-center text-3xl mx-auto mb-4 border border-red-500/20">🏁</div>
      <h3 class="text-lg font-bold mb-2 text-white">Submit Test?</h3>
      <p class="text-xs text-slate-400 mb-1" id="finishModalStats">You answered 0 of 0 questions.</p>
      <p class="text-xs text-amber-400 mb-6 font-semibold" id="finishModalWarning"></p>
      
      <div class="flex gap-3">
        <button onclick="closeFinishModal()" class="flex-1 px-4 py-2.5 rounded-lg bg-white/5 hover:bg-white/10 text-white font-semibold text-xs border border-white/10 transition-all">
          Continue Test
        </button>
        <button onclick="confirmFinishTest()" class="flex-1 px-4 py-2.5 rounded-lg bg-red-500 hover:bg-red-400 text-white font-bold text-xs transition-all shadow-lg shadow-red-500/20">
          Submit
        </button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="test-live.js"></script>
</body>
</html>
