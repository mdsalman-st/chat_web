<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Test — Nexus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="vault.css">

  <!-- Role guard -->
  <script src="role-guard.js" data-page="student"></script>

  <style>
    /* =========================================
       AUTO THEME VARIABLES (Exact Dashboard Match)
       ========================================= */
    :root {
      --bg-color: #05070d;
      --bg-gradient: 
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 40%);
      --grid-color: rgba(255, 255, 255, 0.03);
      
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --text-link: #22d3ee;
      
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-top: rgba(255, 255, 255, 0.25);
      --glass-shadow: rgba(0, 0, 0, 0.6);
      --glass-inset: rgba(255, 255, 255, 0.1);
      
      --inner-glass-bg: rgba(255, 255, 255, 0.02);
      --inner-glass-border: rgba(255, 255, 255, 0.05);
      --inner-glass-hover: rgba(255, 255, 255, 0.08);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #eef2f6;
        --bg-gradient: 
          radial-gradient(circle at 10% 20%, rgba(167, 139, 250, 0.3), transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.3), transparent 40%);
        --grid-color: rgba(0, 0, 0, 0.03);
        
        --text-main: #0f172a;
        --text-muted: #475569;
        --text-link: #0284c7;
        
        --glass-bg: rgba(255, 255, 255, 0.4);
        --glass-border: rgba(255, 255, 255, 0.6);
        --glass-border-top: rgba(255, 255, 255, 0.9);
        --glass-shadow: rgba(0, 0, 0, 0.05);
        --glass-inset: rgba(255, 255, 255, 0.8);
        
        --inner-glass-bg: rgba(255, 255, 255, 0.3);
        --inner-glass-border: rgba(255, 255, 255, 0.5);
        --inner-glass-hover: rgba(255, 255, 255, 0.7);
      }
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        var(--bg-gradient),
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    /* =========================================
       LIQUID GLASS SYSTEM
       ========================================= */
    .liquid-glass {
      background: var(--glass-bg);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-top);
      box-shadow: 0 20px 40px -10px var(--glass-shadow), inset 0 1px 0 var(--glass-inset);
      border-radius: 24px;
      position: relative;
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--glass-inset) 0%, transparent 40%);
      pointer-events: none;
      border-radius: inherit;
      z-index: 1;
    }

    .glass-inner {
      background: var(--inner-glass-bg);
      border: 1px solid var(--inner-glass-border);
      border-radius: 16px;
      transition: all 0.3s ease;
      transform: translateZ(10px);
    }
    .glass-inner:hover { background: var(--inner-glass-hover); }

    .glass-nav {
      background: var(--glass-bg);
      backdrop-filter: blur(40px) saturate(150%);
      -webkit-backdrop-filter: blur(40px) saturate(150%);
      border-bottom: 1px solid var(--glass-border);
    }

    /* =========================================
       ANIMATIONS
       ========================================= */
    @keyframes pulse-glow { 
      0%,100%{box-shadow:0 0 10px rgba(34,211,238,0.1)} 
      50%{box-shadow:0 0 25px rgba(34,211,238,0.4)} 
    }
    .timer-pulse { animation: pulse-glow 2s ease-in-out infinite; }

    @keyframes slide-in { 
      from{opacity:0;transform:translateX(20px)} 
      to{opacity:1;transform:translateX(0)} 
    }
    .question-enter { animation: slide-in 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }

    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .fade-in { animation: fadeIn 0.3s ease forwards; }

    @keyframes pop { 
      0% { transform: scale(1); } 
      50% { transform: scale(0.95); } 
      100% { transform: scale(1); } 
    }

    /* =========================================
       JS GENERATED ELEMENTS OVERRIDE
       ========================================= */
    .option-btn {
      background: var(--inner-glass-bg) !important;
      border: 1px solid var(--inner-glass-border) !important;
      border-radius: 16px;
      color: var(--text-main) !important;
      transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
      transform: translateZ(5px);
    }
    
    .option-btn:hover:not(.answered) {
      background: var(--inner-glass-hover) !important;
      border-color: var(--text-link) !important;
      transform: translateX(5px) translateZ(10px);
      box-shadow: 0 10px 20px -10px rgba(34,211,238,0.2);
    }

    .option-btn:active:not(.answered) {
      animation: pop 0.2s ease;
    }

    /* JS APPLIES THESE CLASSES */
    .option-btn.correct {
      border-color: #10b981 !important; 
      background: rgba(16, 185, 129, 0.15) !important; 
    }
    .option-btn.incorrect {
      border-color: #ef4444 !important; 
      background: rgba(239, 68, 68, 0.15) !important; 
    }
    
    .option-btn p { color: var(--text-main) !important; }
    .option-btn.correct p { color: #34d399 !important; }
    .option-btn.incorrect p { color: #f87171 !important; }

    /* NAVIGATION DOTS */
    .q-dot { 
      width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; 
      font-size:11px; font-weight:700; border:1px solid var(--inner-glass-border); 
      color: var(--text-muted); background: var(--inner-glass-bg); 
      transition: all 0.2s cubic-bezier(0.16,1,0.3,1); 
      cursor: pointer;
    }
    .q-dot:hover { transform: scale(1.1); border-color: var(--text-link); }
    .q-dot.current { border-color: var(--text-link); background: rgba(34,211,238,0.2); color: var(--text-link); transform: scale(1.1); }
    .q-dot.answered-correct { border-color:#10b981; background:rgba(16,185,129,0.15); color:#34d399; }
    .q-dot.answered-incorrect { border-color:#ef4444; background:rgba(239,68,68,0.15); color:#f87171; }
    .q-dot.skipped { border-color:var(--inner-glass-border); background:transparent; color:var(--text-muted); }

    /* UTILS */
    .text-cyan-400 { color: var(--text-link) !important; }
    .text-slate-500, .text-slate-400 { color: var(--text-muted) !important; }
    .bg-white\/\[0\.04\], .bg-white\/\[0\.02\] { background: var(--inner-glass-bg) !important; border-color: var(--inner-glass-border) !important; }
    .border-white\/10, .border-white\/\[0\.06\] { border-color: var(--inner-glass-border) !important; }
  </style>
</head>

<body class="min-h-screen relative antialiased">

  <!-- Loading State -->
  <div id="loadingState" class="relative z-10 min-h-screen flex items-center justify-center">
    <div class="text-center liquid-glass p-10 fade-in">
      <div class="w-10 h-10 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-sm font-semibold" style="color: var(--text-muted);">Starting your test session…</p>
    </div>
  </div>

  <!-- Test UI (hidden until loaded by JS) -->
  <div id="testUI" class="relative z-10 min-h-screen flex-col hidden fade-in">

    <!-- TOPBAR -->
    <header class="glass-nav sticky top-0 z-30">
      <div class="px-4 sm:px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white text-xs font-bold shadow-lg">⚡</div>
            <div>
              <p class="text-sm font-black leading-tight" id="testTitle" style="color: var(--text-main);">Chapter Practice</p>
              <p class="text-[10px]" id="testSubtitle" style="color: var(--text-muted);">Science • Chapter 1</p>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <!-- Timer -->
          <div class="flex items-center gap-2 px-4 py-2 rounded-xl glass-inner timer-pulse">
            <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="text-sm font-bold tabular-nums" id="timerDisplay" style="color: var(--text-main);">00:00</span>
          </div>

          <!-- Progress -->
          <div class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-xl glass-inner">
            <span class="text-xs font-bold" id="progressLabel" style="color: var(--text-link);">0/0</span>
          </div>

          <!-- Finish Button -->
          <button onclick="handleFinishTest()" id="finishBtn" class="px-5 py-2 rounded-xl bg-red-500/15 hover:bg-red-500 text-red-400 hover:text-white font-bold text-xs border border-red-500/30 transition-all">
            Finish Test
          </button>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="w-full h-1" style="background: var(--inner-glass-bg);">
        <div id="progressBar" class="h-1 bg-gradient-to-r from-cyan-400 to-blue-500 transition-all duration-500 ease-out" style="width: 0%"></div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 px-4 sm:px-6 py-8 max-w-6xl w-full mx-auto flex flex-col lg:flex-row gap-6">

      <!-- Question Panel (LEFT) -->
      <div class="flex-1 min-w-0">
        <div id="questionCard" class="liquid-glass p-6 sm:p-8 question-enter">
          <div style="position:relative; z-index:2;">
            
            <!-- Header -->
            <div class="flex items-center justify-between mb-6">
              <div class="flex items-center gap-3">
                <span class="w-10 h-10 rounded-xl glass-inner text-cyan-400 font-black text-sm flex items-center justify-center" id="qNumber">01</span>
                <div class="flex items-center gap-2">
                  <span class="text-[10px] font-bold uppercase tracking-wider px-3 py-1.5 rounded-full glass-inner" style="color: var(--text-muted);" id="qDifficulty">Medium</span>
                  <span id="qTagBadge" class="hidden text-[10px] font-bold px-3 py-1.5 rounded-full border"></span>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <span class="text-[11px]" style="color: var(--text-muted);" id="qSubtopic"></span>
                <span class="text-[11px] font-bold" style="color: var(--text-link);" id="qMarks">1 mark</span>
              </div>
            </div>

            <!-- Question Text -->
            <div class="mb-8">
              <p class="text-lg sm:text-xl font-bold leading-relaxed" style="color: var(--text-main);" id="qText"></p>
              <p class="text-sm mt-2 leading-relaxed" style="color: var(--text-muted);" id="qHindiText"></p>
            </div>

            <!-- Options (Rendered by JS) -->
            <div class="space-y-3" id="optionsContainer"></div>

            <!-- Feedback Area -->
            <div id="feedbackArea" class="mt-6 hidden fade-in">
              <div id="feedbackCard" class="p-5 rounded-2xl border transition-all">
                <div class="flex items-center gap-2 mb-2">
                  <span id="feedbackIcon" class="text-xl"></span>
                  <span id="feedbackTitle" class="font-bold text-sm"></span>
                </div>
                <p id="feedbackExplanation" class="text-xs leading-relaxed" style="color: var(--text-muted);"></p>
              </div>
            </div>

            <!-- Official Paper Attribution -->
            <div id="qSourceAttribution" class="hidden mt-5 p-3 rounded-xl glass-inner text-[11px] flex items-center gap-2 fade-in" style="color: var(--text-muted);">
              <span class="text-cyan-400">🏛️</span>
              <span id="qSourceText"></span>
            </div>

            <!-- Navigation -->
            <div class="flex items-center justify-between mt-8 pt-6 border-t" style="border-color: var(--glass-border);">
              <button onclick="navigateQuestion(-1)" id="prevBtn" class="px-5 py-2.5 rounded-xl glass-inner font-bold text-xs flex items-center gap-2 disabled:opacity-30 disabled:cursor-not-allowed transition-all" style="color: var(--text-main);" disabled>
                <span>←</span> Previous
              </button>
              <button onclick="skipQuestion()" id="skipBtn" class="px-5 py-2.5 rounded-xl glass-inner font-bold text-xs transition-all" style="color: var(--text-muted);">
                Skip →
              </button>
              <button onclick="navigateQuestion(1)" id="nextBtn" class="px-6 py-2.5 rounded-xl bg-cyan-500/15 hover:bg-cyan-500 text-cyan-300 hover:text-ink-950 font-bold text-xs border border-cyan-500/30 transition-all flex items-center gap-2">
                Next <span>→</span>
              </button>
            </div>

          </div>
        </div>
      </div>

      <!-- Right Sidebar -->
      <div class="w-full lg:w-72 shrink-0">
        <div class="liquid-glass p-6 lg:sticky lg:top-24">
          <div style="position:relative; z-index:2;">
            <h3 class="text-xs font-bold uppercase tracking-wider mb-4" style="color: var(--text-muted);">Question Navigator</h3>
            
            <div id="questionNav" class="grid grid-cols-5 gap-2.5 mb-6">
              <!-- Dots rendered by JS -->
            </div>

            <!-- Legend -->
            <div class="space-y-2 text-[11px] border-t pt-4" style="color: var(--text-muted); border-color: var(--glass-border);">
              <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-cyan-500/20 border border-cyan-500/40"></span> Current</div>
              <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-emerald-500/15 border border-emerald-500/40"></span> Correct</div>
              <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-red-500/15 border border-red-500/40"></span> Incorrect</div>
              <div class="flex items-center gap-2"><span class="w-3 h-3 rounded glass-inner"></span> Not Answered</div>
            </div>

            <!-- Stats -->
            <div class="mt-6 pt-4 border-t space-y-3" style="border-color: var(--glass-border);">
              <div class="flex items-center justify-between text-xs">
                <span style="color: var(--text-muted);">Correct</span>
                <span class="font-bold text-emerald-400" id="statCorrect">0</span>
              </div>
              <div class="flex items-center justify-between text-xs">
                <span style="color: var(--text-muted);">Incorrect</span>
                <span class="font-bold text-red-400" id="statIncorrect">0</span>
              </div>
              <div class="flex items-center justify-between text-xs">
                <span style="color: var(--text-muted);">Skipped</span>
                <span class="font-bold" style="color: var(--text-muted);" id="statSkipped">0</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Finish Confirmation Modal -->
  <div id="finishModal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="liquid-glass max-w-sm w-full p-8 text-center fade-in" style="position: relative; z-index: 50;">
      <div style="position:relative; z-index:2;">
        <div class="w-16 h-16 rounded-2xl glass-inner text-red-400 flex items-center justify-center text-3xl mx-auto mb-4">🏁</div>
        <h3 class="text-xl font-black mb-2" style="color: var(--text-main);">Finish Test?</h3>
        <p class="text-xs mb-1" style="color: var(--text-muted);" id="finishModalStats">You answered 0 of 0 questions.</p>
        <p class="text-xs text-amber-400 mb-6 font-semibold" id="finishModalWarning"></p>
        <div class="flex gap-3">
          <button onclick="closeFinishModal()" class="flex-1 px-4 py-3 rounded-xl glass-inner font-bold text-xs transition" style="color: var(--text-main);">
            Continue Test
          </button>
          <button onclick="confirmFinishTest()" class="flex-1 px-4 py-3 rounded-xl bg-red-500 hover:bg-red-400 text-white font-bold text-xs transition">
            Submit & Finish
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="test-live.js"></script>
</body>
</html>
