<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Details — Nexus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: {
              950: '#05070d',
              900: '#0a0e1a',
              850: '#0f1424',
              800: '#141a30',
              700: '#1f2740',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    /* ========== KEYFRAMES ========== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(60px, 40px) scale(1.1); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-70px, -50px) scale(1.15); }
    }
    @keyframes rise {
      0%   { transform: translateY(0);      opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }

    /* ========== UTILITIES ========== */
    .grad-text {
      background: linear-gradient(90deg, #22d3ee, #3b82f6, #8b5cf6, #22d3ee);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s ease infinite;
    }
    .cta { position: relative; overflow: hidden; isolation: isolate; }
    .cta::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
      transform: translateX(-150%);
      transition: transform 0.8s ease;
      z-index: 1;
      pointer-events: none;
    }
    .cta:hover::before { transform: translateX(150%); }

    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .particle {
      position: absolute; border-radius: 50%;
      background: rgba(34, 211, 238, 0.7);
      box-shadow: 0 0 10px rgba(34, 211, 238, 1);
      animation: rise linear infinite;
    }

    .anim { opacity: 0; animation-fill-mode: forwards; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    .anim-1 { animation: fadeUp 0.8s 0.10s forwards; }
    .anim-2 { animation: fadeUp 0.8s 0.25s forwards; }
    .anim-3 { animation: fadeUp 0.8s 0.40s forwards; }
    .anim-4 { animation: fadeUp 0.8s 0.55s forwards; }
    .anim-5 { animation: fadeUp 0.8s 0.70s forwards; }

    .orb-1 { animation: float1 18s ease-in-out infinite; }
    .orb-2 { animation: float2 22s ease-in-out infinite; }

    /* Custom select arrow */
    select.custom-select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1rem;
    }
    select.custom-select option {
      background: #0a0e1a;
      color: #e5e7eb;
    }

    /* Field appear animation */
    @keyframes fieldIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .field-in { animation: fieldIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>

<body class="min-h-screen relative overflow-x-hidden bg-ink-950 text-slate-200 font-sans antialiased selection:bg-cyan-500/20 selection:text-cyan-300">

  <!-- Background Grid -->
  <div class="fixed inset-0 pointer-events-none z-0
              [background-image:linear-gradient(rgba(34,211,238,0.04)_1px,transparent_1px),linear-gradient(90deg,rgba(34,211,238,0.04)_1px,transparent_1px)]
              [background-size:60px_60px]
              [mask-image:radial-gradient(ellipse_at_center,black_30%,transparent_75%)]
              [-webkit-mask-image:radial-gradient(ellipse_at_center,black_30%,transparent_75%)]"></div>

  <!-- Orbs -->
  <div class="orb-1 fixed rounded-full pointer-events-none z-0 blur-[120px] opacity-50 w-[500px] h-[500px] top-[-100px] left-[15%] bg-[radial-gradient(circle,#06b6d4,transparent_70%)]"></div>
  <div class="orb-2 fixed rounded-full pointer-events-none z-0 blur-[120px] opacity-50 w-[450px] h-[450px] bottom-[-100px] right-[10%] bg-[radial-gradient(circle,#6366f1,transparent_70%)]"></div>

  <!-- Particles -->
  <div class="particles" id="particles"></div>

  <!-- MAIN -->
  <main class="relative z-10 min-h-screen flex flex-col items-center justify-start px-6 pt-20 pb-12">

    <!-- Back -->
    <a href="auth.html"
       class="anim anim-1 absolute top-5 left-5 inline-flex items-center gap-2 px-4 py-2 rounded-xl
              bg-white/5 backdrop-blur-xl border border-white/10 text-slate-300 text-sm font-semibold
              transition-all hover:bg-white/10 hover:text-white hover:border-cyan-500/40 hover:-translate-x-1">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 17l-5-5m0 0l5-5m-5 5h12"/>
      </svg>
      <span>Back</span>
    </a>

    <!-- Steps -->
    <div class="anim anim-1 flex items-center gap-2 mb-10">
      <span class="w-6 h-6 rounded-full inline-flex items-center justify-center text-[10px] font-bold bg-white/5 border border-white/10 text-slate-500">1</span>
      <span class="w-8 h-0.5 bg-gradient-to-r from-cyan-500 to-blue-500 rounded"></span>
      <span class="w-6 h-6 rounded-full inline-flex items-center justify-center text-[10px] font-bold bg-white/5 border border-white/10 text-slate-500">2</span>
      <span class="w-8 h-0.5 bg-gradient-to-r from-cyan-500 to-blue-500 rounded"></span>
      <span class="w-6 h-6 rounded-full inline-flex items-center justify-center text-[10px] font-bold bg-gradient-to-br from-cyan-500 to-blue-500 text-white shadow-[0_0_20px_rgba(34,211,238,0.5)]">3</span>
      <span class="w-8 h-0.5 bg-white/10 rounded"></span>
      <span class="w-6 h-6 rounded-full inline-flex items-center justify-center text-[10px] font-bold bg-white/5 border border-white/10 text-slate-500">4</span>
    </div>

    <!-- Heading -->
    <div class="anim anim-2 text-center mb-8">
      <div id="roleBadge" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/25 text-cyan-300 text-xs font-semibold mb-4">
        <span id="roleIcon">🎓</span>
        <span id="roleLabel">Student</span>
      </div>
      <h1 class="font-black tracking-[-0.03em] text-[clamp(1.7rem,4vw,2.75rem)] text-white mb-3">
        Tell us about <span class="grad-text">yourself</span>
      </h1>
      <p class="text-slate-400 text-sm max-w-md mx-auto">
        These details help us tune your workspace. You can change them anytime.
      </p>
    </div>

    <!-- Form Card -->
    <div class="anim anim-3 w-full max-w-md bg-white/[0.03] backdrop-blur-xl border border-white/[0.08] rounded-3xl p-7 sm:p-9 shadow-2xl">

      <form id="detailsForm" autocomplete="off" novalidate>

        <!-- Dynamic fields inject here -->
        <div id="dynamicFields"></div>

        <!-- Continue -->
        <button type="submit" id="continueBtn"
                class="cta w-full inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl mt-2
                       bg-gradient-to-r from-cyan-500 via-blue-500 to-violet-600
                       text-white font-bold text-sm
                       shadow-[0_15px_40px_-10px_rgba(34,211,238,0.5)]
                       transition-all duration-500 hover:-translate-y-0.5 hover:scale-[1.01]">
          <span class="relative z-10" id="continueText">Continue</span>
          <svg class="relative z-10 w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
          </svg>
        </button>

      </form>
    </div>

    <!-- Footnote -->
    <p class="anim anim-4 text-xs text-slate-500 mt-6 text-center max-w-xs">
      Your data stays on your device. Nothing is uploaded.
    </p>

  </main>

  <script src="api.js"></script>
<script src="details.js"></script>
</body>
</html>
