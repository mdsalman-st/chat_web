<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Nexus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: {
              950: '#05070d', 900: '#0a0e1a', 850: '#0f1424',
              800: '#141a30', 700: '#1f2740',
            },
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>

  <style>
    @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes shimmer { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    @keyframes float1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(60px,40px) scale(1.1)} }
    @keyframes float2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-70px,-50px) scale(1.15)} }
    @keyframes rise { 0%{transform:translateY(0);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-110vh);opacity:0} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }

    .grad-text { background:linear-gradient(90deg,#22d3ee,#3b82f6,#8b5cf6,#22d3ee); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 6s ease infinite; }
    .cta { position:relative; overflow:hidden; isolation:isolate; }
    .cta::before { content:""; position:absolute; inset:0; background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%); transform:translateX(-150%); transition:transform 0.8s ease; z-index:1; pointer-events:none; }
    .cta:hover::before { transform:translateX(150%); }

    .particles { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .particle { position:absolute; border-radius:50%; background:rgba(34,211,238,0.7); box-shadow:0 0 10px rgba(34,211,238,1); animation:rise linear infinite; }
    .orb-1 { animation:float1 18s ease-in-out infinite; }
    .orb-2 { animation:float2 22s ease-in-out infinite; }

    .anim { opacity:0; animation-fill-mode:forwards; animation-timing-function:cubic-bezier(0.16,1,0.3,1); }
    .anim-1 { animation:fadeUp 0.7s 0.10s forwards; }
    .anim-2 { animation:fadeUp 0.7s 0.25s forwards; }
    .anim-3 { animation:fadeUp 0.7s 0.40s forwards; }
    .anim-4 { animation:fadeUp 0.7s 0.55s forwards; }

    .tab-btn { padding:0.7rem 1.2rem; border-radius:0.7rem; font-size:0.85rem; font-weight:600; color:#94a3b8; cursor:pointer; transition:all 0.2s ease; border:1px solid transparent; background:transparent; font-family:inherit; flex:1; }
    .tab-btn:hover { color:#fff; background:rgba(255,255,255,0.04); }
    .tab-btn.active { background:linear-gradient(135deg,rgba(34,211,238,0.18),rgba(59,130,246,0.12)); color:#67e8f9; border-color:rgba(34,211,238,0.3); }

    .panel { display:none; animation:fadeUp 0.35s cubic-bezier(0.16,1,0.3,1); }
    .panel.active { display:block; }

    .shake { animation:shake 0.4s ease; }
  </style>
</head>

<body class="min-h-screen relative overflow-x-hidden bg-ink-950 text-slate-200 font-sans antialiased selection:bg-cyan-500/20 selection:text-cyan-300">

  <!-- Background -->
  <div class="fixed inset-0 pointer-events-none z-0
              [background-image:linear-gradient(rgba(34,211,238,0.04)_1px,transparent_1px),linear-gradient(90deg,rgba(34,211,238,0.04)_1px,transparent_1px)]
              [background-size:60px_60px]
              [mask-image:radial-gradient(ellipse_at_center,black_30%,transparent_75%)]"></div>

  <div class="orb-1 fixed rounded-full pointer-events-none z-0 blur-[120px] opacity-50 w-[500px] h-[500px] top-[-100px] left-[15%] bg-[radial-gradient(circle,#06b6d4,transparent_70%)]"></div>
  <div class="orb-2 fixed rounded-full pointer-events-none z-0 blur-[120px] opacity-50 w-[450px] h-[450px] bottom-[-100px] right-[10%] bg-[radial-gradient(circle,#6366f1,transparent_70%)]"></div>

  <div class="particles" id="particles"></div>

  <!-- MAIN -->
  <main class="relative z-10 min-h-screen flex flex-col items-center justify-start px-6 pt-20 pb-12">

    <!-- Back -->
    <a href="profession.html"
       class="anim anim-1 absolute top-5 left-5 inline-flex items-center gap-2 px-4 py-2 rounded-xl
              bg-white/5 backdrop-blur-xl border border-white/10 text-slate-300 text-sm font-semibold
              transition-all hover:bg-white/10 hover:text-white hover:border-cyan-500/40 hover:-translate-x-1">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M11 17l-5-5m0 0l5-5m-5 5h12"/>
      </svg>
      <span>Back</span>
    </a>

    <!-- Heading -->
    <div class="anim anim-2 text-center mb-8">
      <h1 class="font-black tracking-[-0.03em] text-[clamp(1.8rem,4.5vw,2.5rem)] text-white mb-3">
        Welcome to <span class="grad-text">Nexus</span>
      </h1>
      <p class="text-slate-400 text-sm max-w-md mx-auto">
        Sign in to your existing account or create a new one.
      </p>
    </div>

    <!-- Form Card -->
    <div class="anim anim-3 w-full max-w-md bg-white/[0.03] backdrop-blur-xl border border-white/[0.08] rounded-3xl p-6 sm:p-7 shadow-2xl">

      <!-- Tabs -->
      <div class="flex gap-1.5 p-1 rounded-2xl bg-ink-950/60 border border-white/[0.06] mb-6">
        <button type="button" class="tab-btn active" data-tab="login" onclick="switchTab('login')">
          🔐 Sign In
        </button>
        <button type="button" class="tab-btn" data-tab="signup" onclick="switchTab('signup')">
          ✨ Sign Up
        </button>
      </div>

      <!-- ============ LOGIN PANEL ============ -->
      <div id="panel-login" class="panel active">
        <form id="loginForm" autocomplete="on">

          <div class="mb-5">
            <label class="block text-[10px] font-bold uppercase tracking-[0.15em] text-slate-400 mb-2">Email</label>
            <input type="email" id="loginEmail" required autocomplete="email"
                   placeholder="you@example.com"
                   class="w-full px-4 py-3 rounded-xl bg-ink-900/60 border border-white/10 text-white text-sm placeholder-slate-600
                          focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition-all">
          </div>

          <div class="mb-5">
            <label class="block text-[10px] font-bold uppercase tracking-[0.15em] text-slate-400 mb-2">Password</label>
            <div class="relative">
              <input type="password" id="loginPassword" required autocomplete="current-password"
                     placeholder="••••••••"
                     class="w-full px-4 pr-12 py-3 rounded-xl bg-ink-900/60 border border-white/10 text-white text-sm placeholder-slate-600
                            focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition-all">
              <button type="button" id="toggleLoginPwd"
                      class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-sm transition">
                👁️
              </button>
            </div>
          </div>

          <button type="submit" id="loginBtn"
                  class="cta w-full inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl
                         bg-gradient-to-r from-cyan-500 via-blue-500 to-violet-600
                         text-white font-bold text-sm
                         shadow-[0_15px_40px_-10px_rgba(34,211,238,0.5)]
                         transition-all duration-500 hover:-translate-y-0.5 hover:scale-[1.01]
                         disabled:opacity-40 disabled:cursor-not-allowed">
            <span class="relative z-10" id="loginBtnText">Sign In</span>
            <svg class="relative z-10 w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
            </svg>
          </button>

          <p class="text-center text-xs text-slate-500 mt-5">
            Don't have an account?
            <button type="button" onclick="switchTab('signup')" class="text-cyan-400 hover:text-cyan-300 font-semibold">Sign up</button>
          </p>

        </form>
      </div>

      <!-- ============ SIGNUP PANEL ============ -->
      <div id="panel-signup" class="panel">
        <form id="signupForm" autocomplete="on">

          <div class="mb-5">
            <label class="block text-[10px] font-bold uppercase tracking-[0.15em] text-slate-400 mb-2">Full Name *</label>
            <input type="text" id="suName" required maxlength="60" autocomplete="name"
                   placeholder="e.g. Rahul Sharma"
                   class="w-full px-4 py-3 rounded-xl bg-ink-900/60 border border-white/10 text-white text-sm placeholder-slate-600
                          focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition-all">
          </div>

          <div class="mb-5">
            <label class="block text-[10px] font-bold uppercase tracking-[0.15em] text-slate-400 mb-2">Phone Number *</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm font-medium">+91</span>
              <input type="tel" id="suPhone" required maxlength="10" inputmode="numeric" autocomplete="tel-national"
                     placeholder="9876543210"
                     class="w-full pl-12 pr-4 py-3 rounded-xl bg-ink-900/60 border border-white/10 text-white text-sm placeholder-slate-600
                            focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition-all">
            </div>
          </div>

          <div class="mb-5">
            <label class="block text-[10px] font-bold uppercase tracking-[0.15em] text-slate-400 mb-2">Email *</label>
            <input type="email" id="suEmail" required autocomplete="email"
                   placeholder="you@example.com"
                   class="w-full px-4 py-3 rounded-xl bg-ink-900/60 border border-white/10 text-white text-sm placeholder-slate-600
                          focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition-all">
          </div>

          <div class="mb-5">
            <label class="block text-[10px] font-bold uppercase tracking-[0.15em] text-slate-400 mb-2">Password *</label>
            <div class="relative">
              <input type="password" id="suPassword" required minlength="8" autocomplete="new-password"
                     placeholder="Minimum 8 characters"
                     class="w-full px-4 pr-12 py-3 rounded-xl bg-ink-900/60 border border-white/10 text-white text-sm placeholder-slate-600
                            focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition-all">
              <button type="button" id="toggleSuPwd"
                      class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-sm transition">
                👁️
              </button>
            </div>
          </div>

          <!-- Security note -->
          <div class="mb-5 p-3 rounded-xl bg-cyan-500/[0.06] border border-cyan-500/20 flex gap-2.5">
            <span class="text-cyan-400 text-base leading-none">🔒</span>
            <p class="text-[11px] text-slate-400 leading-relaxed">
              Password is hashed with <strong class="text-cyan-300">bcrypt (12 rounds)</strong> + unique salt + pepper on the server.
            </p>
          </div>

          <button type="submit" id="signupBtn"
                  class="cta w-full inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl
                         bg-gradient-to-r from-cyan-500 via-blue-500 to-violet-600
                         text-white font-bold text-sm
                         shadow-[0_15px_40px_-10px_rgba(34,211,238,0.5)]
                         transition-all duration-500 hover:-translate-y-0.5 hover:scale-[1.01]
                         disabled:opacity-40 disabled:cursor-not-allowed">
            <span class="relative z-10" id="signupBtnText">Create Account</span>
            <svg class="relative z-10 w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
            </svg>
          </button>

          <p class="text-center text-xs text-slate-500 mt-5">
            Already have an account?
            <button type="button" onclick="switchTab('login')" class="text-cyan-400 hover:text-cyan-300 font-semibold">Sign in</button>
          </p>

        </form>
      </div>

    </div>

    <!-- Footnote -->
    <p class="anim anim-4 text-xs text-slate-500 mt-6 text-center max-w-xs">
      Your data stays secure. Nothing is shared with third parties.
    </p>

  </main>

  <!-- Toast container -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-4 opacity-0 transition-all duration-300 px-5 py-3 rounded-xl text-sm font-semibold text-white z-50 pointer-events-none"></div>

  <!-- Scripts -->
  <script src="api.js"></script>
  <script>
    /* ---------- Toast ---------- */
    function showToast(msg, type = 'info') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = type === 'error' ? '#dc2626' : type === 'success' ? '#059669' : '#111827';
      t.classList.remove('opacity-0', 'translate-y-4');
      t.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        t.classList.add('opacity-0', 'translate-y-4');
        t.classList.remove('opacity-100', 'translate-y-0');
      }, 2400);
    }

    /* ---------- Tab Switch ---------- */
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + tab).classList.add('active');
    }
    window.switchTab = switchTab;

    /* ---------- Password Toggles ---------- */
    document.getElementById('toggleLoginPwd').addEventListener('click', () => {
      const i = document.getElementById('loginPassword');
      const isPwd = i.type === 'password';
      i.type = isPwd ? 'text' : 'password';
      document.getElementById('toggleLoginPwd').textContent = isPwd ? '🙈' : '👁️';
    });

    document.getElementById('toggleSuPwd').addEventListener('click', () => {
      const i = document.getElementById('suPassword');
      const isPwd = i.type === 'password';
      i.type = isPwd ? 'text' : 'password';
      document.getElementById('toggleSuPwd').textContent = isPwd ? '🙈' : '👁️';
    });

    /* ---------- Phone: only digits ---------- */
    document.getElementById('suPhone').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10);
    });

    /* ---------- LOGIN SUBMIT ---------- */
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('loginBtnText');
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) return showToast('Fill all fields', 'error');

      btn.disabled = true;
      btnText.textContent = 'Signing in…';

      try {
        const res = await API.auth.login(email, password);
        showToast('Welcome back, ' + res.user.name + ' ✓', 'success');
        btnText.textContent = 'Success ✓';

        setTimeout(() => {
          document.body.style.transition = 'opacity 0.35s ease';
          document.body.style.opacity = '0';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 320);
        }, 600);
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btnText.textContent = 'Sign In';
        showToast(err.message || 'Login failed', 'error');
        document.querySelector('#panel-login').classList.add('shake');
        setTimeout(() => document.querySelector('#panel-login').classList.remove('shake'), 500);
      }
    });

    /* ---------- SIGNUP SUBMIT ---------- */
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      const btnText = document.getElementById('signupBtnText');

      const name = document.getElementById('suName').value.trim();
      const phone = document.getElementById('suPhone').value.trim();
      const email = document.getElementById('suEmail').value.trim();
      const password = document.getElementById('suPassword').value;
      const role = localStorage.getItem('nexus_user_role') || 'student';

      if (!name || name.length < 2) return showToast('Name must be at least 2 characters', 'error');
      if (!/^[6-9]\d{9}$/.test(phone)) return showToast('Invalid phone number', 'error');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showToast('Invalid email', 'error');
      if (password.length < 8) return showToast('Password must be 8+ characters', 'error');

      btn.disabled = true;
      btnText.textContent = 'Creating account…';

      try {
        const res = await API.auth.signup({
          name, email, phone, password, role,
        });

        showToast('Account created ✓', 'success');
        btnText.textContent = 'Success ✓';

        setTimeout(() => {
          document.body.style.transition = 'opacity 0.35s ease';
          document.body.style.opacity = '0';
          setTimeout(() => { window.location.href = 'details.html'; }, 320);
        }, 600);
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btnText.textContent = 'Create Account';
        showToast(err.message || 'Signup failed', 'error');
        document.querySelector('#panel-signup').classList.add('shake');
        setTimeout(() => document.querySelector('#panel-signup').classList.remove('shake'), 500);
      }
    });

    /* ---------- If already logged in → redirect ---------- */
    if (API.Token.exists()) {
      window.location.href = 'dashboard.html';
    }

    /* ---------- Smart tab default ---------- */
    // Agar user profession.html se aaya hai (role set) → Signup tab
    // Warna → Login tab
    const hasRole = !!localStorage.getItem('nexus_user_role');
    if (hasRole) switchTab('signup');

    /* ---------- Particles ---------- */
    (function spawnParticles() {
      const wrap = document.getElementById('particles');
      if (!wrap) return;
      for (let i = 0; i < 22; i++) {
        const p = document.createElement('span');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = (100 + Math.random() * 20) + '%';
        p.style.animationDuration = (14 + Math.random() * 16) + 's';
        p.style.animationDelay = (-Math.random() * 25) + 's';
        const s = 1 + Math.random() * 2;
        p.style.width = s + 'px';
        p.style.height = s + 'px';
        wrap.appendChild(p);
      }
    })();
  </script>

</body>
</html>
