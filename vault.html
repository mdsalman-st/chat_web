<!-- ============================================================================
     VAULT — Complete Component (CSS + HTML + JS)
     Just paste this WHOLE block before </body> in any page
     ============================================================================ -->

<link rel="stylesheet" href="vault.css">

<div id="chatVault" class="vault-overlay vault-hidden" role="region" aria-label="Private chat">

  <header class="vault-header">
    <div class="vault-header-left">
      <button type="button" class="vault-back-btn" id="vaultBackBtn" aria-label="Back">←</button>
      <span class="vault-lock" aria-hidden="true">🔒</span>
      <div class="vault-header-info">
        <p class="vault-header-title">Secure Channel</p>
        <p class="vault-header-status"><span class="vault-dot"></span> End-to-end encrypted</p>
      </div>
    </div>
    <button type="button" class="vault-exit-btn" id="vaultExitBtn" aria-label="Exit">✕ Exit</button>
  </header>

  <div class="vault-body">

    <aside class="vault-sidebar" id="vaultSidebar">

      <div class="vault-tabs">
        <button type="button" class="vault-tab active" data-vtab="contacts">👥 Contacts</button>
        <button type="button" class="vault-tab" data-vtab="rooms">🔗 Rooms</button>
      </div>

      <div class="vault-panel active" data-vpanel="contacts">
        <div class="vault-search-row">
          <input type="text" id="vaultContactSearch" placeholder="Search phone or username…" autocomplete="off" spellcheck="false" maxlength="30">
        </div>
        <div class="vault-list" id="vaultContactList">
          <div class="vault-empty-list">
            <span>🔍</span>
            <p>Search for a contact to start chatting</p>
          </div>
        </div>
      </div>

      <div class="vault-panel" data-vpanel="rooms">
        <div class="vault-room-actions">
          <button type="button" class="vault-action-btn primary" id="vaultCreateRoomBtn">
            ✨ Create Room
          </button>
        </div>
        <div class="vault-join-row">
          <input type="text" id="vaultJoinCode" placeholder="Enter code e.g. GHOST-77" autocomplete="off" spellcheck="false" maxlength="12">
          <button type="button" class="vault-join-btn" id="vaultJoinRoomBtn">Join</button>
        </div>
        <div class="vault-list" id="vaultRoomList">
          <div class="vault-empty-list">
            <span>🔗</span>
            <p>No rooms yet. Create one or join with a code.</p>
          </div>
        </div>
      </div>

    </aside>

    <section class="vault-main" id="vaultMain">

      <div class="vault-no-chat" id="vaultNoChat">
        <div class="vault-no-chat-icon">💬</div>
        <h3>No chat open</h3>
        <p>Select a contact or room from the list</p>
      </div>

      <div class="vault-chat hidden" id="vaultChat">

        <header class="vault-chat-header">
          <button type="button" class="vault-chat-back" id="vaultChatBack" aria-label="Back to list">←</button>
          <div class="vault-avatar" id="vaultChatAvatar">?</div>
          <div class="vault-chat-info">
            <p class="vault-chat-name" id="vaultChatName">Unknown</p>
            <p class="vault-chat-status" id="vaultChatStatus">Offline</p>
          </div>
        </header>

        <div class="vault-messages" id="vaultMessages"></div>

        <footer class="vault-composer">
          <input type="text" id="vaultMessageInput" placeholder="Type a message…" autocomplete="off" maxlength="2000">
          <button type="button" class="vault-send-btn" id="vaultSendBtn" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </footer>

      </div>

    </section>

  </div>

</div>

<script src="api.js"></script>
<script src="socket-client.js"></script>
<script src="vault.js"></script>
